<div class="login-wrapper">
  <div class="login-card card border-0">
    <div class="card-body p-4 p-md-5">

      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
               fill="currentColor" viewBox="0 0 16 16">
            <path d="M5.338 1.59a61 61 0 0 0-2.837.856.48.48 0 0 0-.328.39c-.554 4.157.726 7.19 2.253 9.188a10.7 10.7 0 0 0 2.287 2.233c.346.244.652.42.893.533q.18.085.293.118a1 1 0 0 0 .101.025 1 1 0 0 0 .1-.025q.114-.034.294-.118c.24-.113.547-.29.893-.533a10.7 10.7 0 0 0 2.287-2.233c1.527-1.997 2.807-5.031 2.253-9.188a.48.48 0 0 0-.328-.39c-.651-.213-1.75-.56-2.837-.855C9.552 1.29 8.531 1.067 8 1.067c-.53 0-1.552.223-2.662.524z"/>
          </svg>
        </div>
        <h3 class="fw-bold mb-1">Seguros Auto</h3>
        <p class="text-muted mb-0">Inicia sesión para continuar</p>
      </div>

      <div class="alert alert-danger d-flex align-items-center py-2"
           role="alert" *ngIf="error">
        <span class="me-2">⚠️</span>
        <div>{{ error }}</div>
      </div>

      <form (ngSubmit)="login()" #loginForm="ngForm" novalidate>

        <div class="form-floating mb-3">
          <input
            id="username"
            name="username"
            class="form-control"
            placeholder="Usuario"
            autocomplete="username"
            required
            [(ngModel)]="username">
          <label for="username">Usuario</label>
        </div>

        <div class="form-floating mb-4 position-relative">
          <input
            id="password"
            name="password"
            class="form-control pe-5"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Contraseña"
            autocomplete="current-password"
            required
            [(ngModel)]="password">
          <label for="password">Contraseña</label>

          <button type="button"
                  class="btn btn-link toggle-pass"
                  (click)="showPassword = !showPassword"
                  [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            {{ showPassword ? 'Ocultar' : 'Ver' }}
          </button>
        </div>

        <button type="submit"
                class="btn btn-primary btn-lg w-100"
                [disabled]="loading || !username || !password">
          <span class="spinner-border spinner-border-sm me-2"
                *ngIf="loading"></span>
          {{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>

      </form>

    </div>
  </div>
</div>
